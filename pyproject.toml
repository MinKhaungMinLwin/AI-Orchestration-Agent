[project]
name = "tstation-ai"
version = "0.1.0"
description = "TStation AI of Hankooktire"
readme = "README.md"
authors = [
  { name = "xxx" }
]
requires-python = ">=3.12"
dependencies = [
    "mypy>=1.15.0",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "ruff>=0.9.5",
    "isort>=5.13.2",
    "pandas-stubs~=2.2.3",
]

[dependency-groups]

## App
# tstation-ai
tstation-ai = [
    # API
    "python-multipart>=0.0.20",
    "fastapi>=0.104.0",
    "uvicorn>=0.23.2",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.10.1",

    # HTTP Request
    "requests>=2.32.4",
    "httpx>=0.28.1",

    # Worker
    "redis>=6.2.0",
    "celery>=5.5.3",

    # Docker execute
    "docker>=7.1.0",

    # AWS provider
    "boto3>=1.40.18",

    # LLM
    "openai>=1.99.9",

    # Tracing
    "langfuse==3.11.2",

    ## Process Data
    "python-toon==0.1.3",

    ## RAG
    # Chunking
    "llama-index-core>=0.12.32",
    "llama-index-readers-file>=0.4.7",
    "openai>=1.76.0",
    # Embeddings & Reranking
    "llama-index-embeddings-openai>=0.3.1",
    "llama-index-postprocessor-tei-rerank>=0.3.0",
    "llama-index-embeddings-cohere>=0.4.0",
    "llama-index-postprocessor-cohere-rerank>=0.3.0",
    # Qdrant
    "qdrant-client>=1.13.3",
    "llama-index-vector-stores-qdrant>=0.6.0",

    # Detect Language
    "lingua-language-detector>=2.1.1",
]


## UI Demo
tstation-ui-demo = [
    "httpx>=0.23",
    "curlify>=2.2.1",
    "streamlit>=1.14.1",
    "streamlit-nested-layout>=0.1.4",
    "streamlit-mermaid>=0.3.0",
]
