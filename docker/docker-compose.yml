version: "3.11"

services:
  # === Proxy - NGINX (Public-facing, bridges to internal-net) ===
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./config/nginx/certs:/etc/nginx/certs:ro
    restart: always
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx/client_temp:mode=0755,uid=101,gid=101
      - /var/cache/nginx/proxy_temp:mode=0755,uid=101,gid=101
      - /var/cache/nginx/fastcgi_temp:mode=0755,uid=101,gid=101
      - /var/cache/nginx/uwsgi_temp:mode=0755,uid=101,gid=101
      - /var/cache/nginx/scgi_temp:mode=0755,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal-net
    depends_on:
      tstation-ai:
        condition: service_started
      tstation-ui-demo:
        condition: service_started

  # === AI Gateway ===
  ai-gateway:
    image: ghcr.io/berriai/litellm:v1.83.4-nightly
    volumes:
      - ./config/llm/conf-gateway.yaml:/app/config.yaml:ro
    command: ["--config=/app/config.yaml", "--port", "8000"]
    expose:
      - 8000
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - ../.env
    environment:
      - LITELLM_LOG=${LOG_LEVEL}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal-net

  # === API ===
  tstation-ai:
    build: ../app/tstation-ai
    expose:
      - 8000
    read_only: true
    tmpfs:
      - /tmp
      - /tmp/uv-cache
      - /app/logs
    environment:
      - UV_CACHE_DIR=/tmp/uv-cache
    env_file:
      - ../.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal-net
    depends_on:
      ai-gateway:
        condition: service_started
      redis-conversation-management:
        condition: service_started

  # === Vector Database ===
  qdrant:
    image: qdrant/qdrant:latest
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - qdrant-data:/qdrant/storage
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal-net

  # === Redis Conversation Management ===
  redis-conversation-management:
    image: redis
    command: redis-server --requirepass ${REDIS_CONVERSATION_MANAGEMENT_PASSWORD}
    expose:
      - 6379
    volumes:
      - redis-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal-net

  # === APP UI ===
  tstation-ui-demo:
    build: ../app/tstation-ui-demo
    expose:
      - 3000
    read_only: true
    tmpfs:
      - /tmp
      - /tmp/uv-cache
    environment:
      - UV_CACHE_DIR=/tmp/uv-cache
      - HOME=/tmp
    env_file:
      - ../.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal-net
    depends_on:
      tstation-ai:
        condition: service_started

# === Networks ===
networks:
  internal-net:
    driver: bridge

# === Volumes ===
volumes:
  redis-data:
  qdrant-data:

configs:
  qdrant_config:
    content: |
      log_level: INFO