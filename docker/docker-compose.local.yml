services:
  local-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tstation
      POSTGRES_PASSWORD: tstation
      POSTGRES_DB: postgres
    volumes:
      - local-postgres-data:/var/lib/postgresql/data
      - ./scripts/init-local-postgres.sql:/docker-entrypoint-initdb.d/init-local-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tstation -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal-net

  ai-gateway:
    depends_on:
      local-postgres:
        condition: service_healthy
    environment:
      - LITELLM_DB_URL=postgresql://tstation:tstation@local-postgres:5432/litellm
      - DATABASE_URL=postgresql://tstation:tstation@local-postgres:5432/litellm

  langfuse-worker:
    depends_on:
      local-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tstation:tstation@local-postgres:5432/langfuse
      DIRECT_URL: postgresql://tstation:tstation@local-postgres:5432/langfuse

  langfuse-server:
    depends_on:
      local-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tstation:tstation@local-postgres:5432/langfuse
      DIRECT_URL: postgresql://tstation:tstation@local-postgres:5432/langfuse

  langfuse-redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${LANGFUSE_REDIS_PASSWORD:-langfuseredis}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${LANGFUSE_REDIS_PASSWORD:-langfuseredis} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal-net

  langfuse-worker:
    depends_on:
      langfuse-redis:
        condition: service_healthy
    environment:
      REDIS_CONNECTION_STRING: redis://:${LANGFUSE_REDIS_PASSWORD:-langfuseredis}@langfuse-redis:6379/0

  langfuse-server:
    depends_on:
      langfuse-redis:
        condition: service_healthy
    environment:
      REDIS_CONNECTION_STRING: redis://:${LANGFUSE_REDIS_PASSWORD:-langfuseredis}@langfuse-redis:6379/0

  qdrant:
    ports:
      - "6333:6333"

volumes:
  local-postgres-data:
