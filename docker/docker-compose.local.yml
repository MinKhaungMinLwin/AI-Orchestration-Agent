services:
  redis-conversation-management:
    image: redis
    command: >
      redis-server
      --requirepass ${REDIS_CONVERSATION_MANAGEMENT_PASSWORD}
      --maxmemory 450mb
      --maxmemory-policy allkeys-lru
    expose:
      - 6379
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_CONVERSATION_MANAGEMENT_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - internal-net

  local-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tstation
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?LANGFUSE_POSTGRES_PASSWORD must be set}
      POSTGRES_DB: postgres
    volumes:
      - local-postgres-data:/var/lib/postgresql/data
      - ./scripts/init-local-postgres.sql:/docker-entrypoint-initdb.d/init-local-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tstation -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal-net

  ai-gateway:
    depends_on:
      local-postgres:
        condition: service_healthy
    environment:
      - LITELLM_DB_URL=postgresql://tstation:${LANGFUSE_POSTGRES_PASSWORD:?LANGFUSE_POSTGRES_PASSWORD must be set}@local-postgres:5432/litellm
      - DATABASE_URL=postgresql://tstation:${LANGFUSE_POSTGRES_PASSWORD:?LANGFUSE_POSTGRES_PASSWORD must be set}@local-postgres:5432/litellm

  tstation-ai:
    depends_on:
      redis-conversation-management:
        condition: service_started

  langfuse-worker:
    depends_on:
      local-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tstation:${LANGFUSE_POSTGRES_PASSWORD:?LANGFUSE_POSTGRES_PASSWORD must be set}@local-postgres:5432/langfuse
      DIRECT_URL: postgresql://tstation:${LANGFUSE_POSTGRES_PASSWORD:?LANGFUSE_POSTGRES_PASSWORD must be set}@local-postgres:5432/langfuse
      REDIS_CONNECTION_STRING: redis://:${LANGFUSE_REDIS_PASSWORD:?LANGFUSE_REDIS_PASSWORD must be set}@langfuse-redis:6379/0

  langfuse-server:
    depends_on:
      local-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tstation:${LANGFUSE_POSTGRES_PASSWORD:?LANGFUSE_POSTGRES_PASSWORD must be set}@local-postgres:5432/langfuse
      DIRECT_URL: postgresql://tstation:${LANGFUSE_POSTGRES_PASSWORD:?LANGFUSE_POSTGRES_PASSWORD must be set}@local-postgres:5432/langfuse
      REDIS_CONNECTION_STRING: redis://:${LANGFUSE_REDIS_PASSWORD:?LANGFUSE_REDIS_PASSWORD must be set}@langfuse-redis:6379/0

  langfuse-redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${LANGFUSE_REDIS_PASSWORD:?LANGFUSE_REDIS_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${LANGFUSE_REDIS_PASSWORD:?LANGFUSE_REDIS_PASSWORD must be set} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal-net

  qdrant:
    ports:
      - "6333:6333"

volumes:
  local-postgres-data:
  redis-data:
