version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    networks:
      - project-net  

networks:
  project-net:
    name: ${DOCKER_NETWORK_NAME}
    driver: bridge