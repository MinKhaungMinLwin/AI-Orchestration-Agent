#### Settings
general_settings:
  master_key: "os.environ/AI_GATEWAY_API_KEY"
  database_url: "os.environ/LITELLM_DB_URL"

litellm_settings:
  drop_params: true
  num_retries: 3
  retry_after: 2
  request_timeout: 180
  callbacks: ["otel"]
  user_api_key_cache_ttl: 10
