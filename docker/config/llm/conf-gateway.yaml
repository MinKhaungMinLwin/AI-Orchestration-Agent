model_list:
  ## API Model
  # LLM
  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_base: https://api.openai.com/v1
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: gpt-5.3
    litellm_params:
      model: openai/gpt-5.3
      api_base: https://api.openai.com/v1
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: gpt-5.2
    litellm_params:
      model: openai/gpt-5.2
      api_base: https://api.openai.com/v1
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: gpt-5.1
    litellm_params:
      model: openai/gpt-5.1
      api_base: https://api.openai.com/v1
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: gpt-5.0
    litellm_params:
      model: openai/gpt-5
      api_base: https://api.openai.com/v1
      api_key: "os.environ/OPENAI_API_KEY"

  # AWS Bedrock
  - model_name: bedrock-claude-haiku-4-5
    litellm_params:
      model: bedrock/arn:aws:bedrock:ap-northeast-2:763865062538:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0
      api_key: "os.environ/AWS_BEARER_TOKEN_BEDROCK"

#### Settings
general_settings:
  master_key: "os.environ/AI_GATEWAY_API_KEY"

litellm_settings:
  drop_params: false
  num_retries: 3
  retry_after: 2
  request_timeout: 30
  callbacks: ["otel"]

# Fallbacks when error
fallbacks:
  - gpt-5.4: ["gpt-5.3", "gpt-5.2", "gpt-5.1", "gpt-5.0"]
  - gpt-5.3: ["gpt-5.2", "gpt-5.1", "gpt-5.0"]
  - gpt-5.2: ["gpt-5.1", "gpt-5.0"]
  - gpt-5.1: ["gpt-5.0"]
