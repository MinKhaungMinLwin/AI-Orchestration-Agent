#### Settings
general_settings:
  master_key: "os.environ/AI_GATEWAY_API_KEY"

litellm_settings:
  drop_params: true
  num_retries: 3
  retry_after: 2
  request_timeout: 180
  callbacks: ["otel"]

# Fallbacks when error
fallbacks:
  - bedrock-claude-haiku-4-5: []
  - gpt-5.4: ["gpt-5.2", "gpt-5.1", "gpt-5.0"]
  - gpt-5.2: ["gpt-5.1", "gpt-5.0"]
  - gpt-5.1: ["gpt-5.0"]
  - gpt-4o: ["gpt-4o-mini", "gpt-5.0"]
  - gpt-4o-mini: ["gpt-5.0"]
  - gpt-4.1: ["gpt-4.1-mini", "gpt-4o-mini", "gpt-5.0"]
  - gpt-4.1-mini: ["gpt-4o-mini", "gpt-5.0"]
