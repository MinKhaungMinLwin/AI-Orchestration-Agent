model_list:
  ## API Model
  # LLM
  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_base: https://api.openai.com/v1
      api_key: "os.environ/OPENAI_API_KEY"
  - model_name: gpt-5.4-reasoning
    litellm_params:
      model: openai/gpt-5.4
      api_base: https://api.openai.com/v1
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: "medium"
  - model_name: gpt-5.3
    litellm_params:
      model: openai/gpt-5.3
      api_base: https://api.openai.com/v1
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: gpt-5.2
    litellm_params:
      model: openai/gpt-5.2
      api_base: https://api.openai.com/v1
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: gpt-5.1
    litellm_params:
      model: openai/gpt-5.1
      api_base: https://api.openai.com/v1
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: gpt-5.0
    litellm_params:
      model: openai/gpt-5
      api_base: https://api.openai.com/v1
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_base: https://api.openai.com/v1
      api_key: "os.environ/OPENAI_API_KEY"

#### Settings
general_settings:
  master_key: "os.environ/AI_GATEWAY_API_KEY"

litellm_settings:
  drop_params: false
  num_retries: 3
  retry_after: 2
  request_timeout: 30
  callbacks: ["otel"]

# Fallbacks when error
fallbacks:
  - bedrock-claude-haiku-4-5: []
  - gpt-5.4: ["gpt-5.3", "gpt-5.2", "gpt-5.1", "gpt-5.0"]
  - gpt-5.3: ["gpt-5.2", "gpt-5.1", "gpt-5.0"]
  - gpt-5.2: ["gpt-5.1", "gpt-5.0"]
  - gpt-5.1: ["gpt-5.0"]
  - gpt-4o-mini: ["gpt-5.0"]
