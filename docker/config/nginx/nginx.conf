# HTTP server
server {
    listen 80;
    server_name _;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"tstation-agent"}';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name _;

    # Docker internal DNS resolver for runtime service discovery.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # TLS configuration
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"tstation-agent"}';
    }

    location = / {
        default_type application/json;
        return 200 '{"status":"ok","service":"tstation-agent"}';
    }

    # API endpoints
    location /api/ {
        set $api_upstream http://tstation-ai:8000;
        proxy_pass         $api_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Prefix /api;

        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # SSE streaming timeout (default 60s is too short for AI responses)
        proxy_read_timeout 300;
        proxy_send_timeout 300;

        # Max file <2GB
        client_max_body_size 2G;
        proxy_request_buffering off;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

}
