version: "3.11"

services:
  # === Proxy - NGINX ===
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: always
    networks:
      - project-net

# === Network ===
networks:
  project-net:
    name: ${DOCKER_NETWORK_NAME}
    driver: bridge
